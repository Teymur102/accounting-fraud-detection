[project]
name = "frauddetect"
version = "0.1.0"
description = "Beneish M-score vs machine learning for accounting fraud, evaluated out-of-time on Bao et al. (2020) data"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Teymur Eyvazov" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
